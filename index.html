<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBTI 마음 돌봄 서비스</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <!-- Header: API Key 상태 표시줄 -->
    <header class="header">
      <div class="api-status" id="apiStatus">
        <span class="status-icon">⏳</span>
        <span class="status-text">API 연결 확인 중...</span>
      </div>
    </header>

    <!-- Section 1: 대시보드 (Main) -->
    <section id="dashboardSection" class="section dashboard-section">
      <div class="container">
        <h1 class="main-title">🌿 MBTI 마음 돌봄 서비스</h1>
        <p class="intro-text">
          당신의 MBTI 성향을 분석하고, 맞춤형 상담을 통해 마음을 돌봐드립니다.
          <br>간단한 검사를 통해 자신을 알아가고, 따뜻한 위로를 받아보세요.
        </p>
        
        <div class="chart-container">
          <h2 class="chart-title">참여자 MBTI 유형 분포</h2>
          <canvas id="mbtiChart"></canvas>
        </div>

        <button id="startTestBtn" class="primary-btn">검사 시작하기</button>
      </div>
    </section>

    <!-- Section 2: MBTI 검사 (Test) -->
    <section id="testSection" class="section test-section" style="display: none;">
      <div class="container">
        <h2 class="section-title">MBTI 검사</h2>
        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="progress-text" id="progressText">질문 1 / 12</span>
        </div>

        <div class="question-container">
          <h3 class="question-text" id="questionText"></h3>
          <div class="answer-options" id="answerOptions">
            <!-- 동적으로 생성됨 -->
          </div>
        </div>
      </div>
    </section>

    <!-- Section 3: 결과 및 상담 (Result & Chat) -->
    <section id="resultSection" class="section result-section" style="display: none;">
      <div class="container">
        <h2 class="section-title">검사 결과</h2>
        
        <div class="result-card" id="resultCard">
          <!-- 동적으로 생성됨 -->
        </div>

        <div class="chat-container">
          <h3 class="chat-title">💬 마음 돌봄 챗봇</h3>
          <div class="chat-messages" id="chatMessages">
            <!-- 채팅 메시지들이 여기에 표시됨 -->
          </div>
          <div class="chat-input-container">
            <input 
              type="text" 
              id="chatInput" 
              class="chat-input" 
              placeholder="메시지를 입력하세요..."
              maxlength="500"
            />
            <button id="sendBtn" class="send-btn">전송</button>
          </div>
        </div>

        <button id="submitResultBtn" class="secondary-btn">내 결과 제출하기</button>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
